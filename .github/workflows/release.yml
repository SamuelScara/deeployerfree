# Builds a ready-to-run package for each operating system.
# - Push a tag like v1.0.0 to publish them in a GitHub Release.
# - Or run it manually from the Actions tab to just download the build artifacts.
name: Build executables

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Older Ubuntu = older glibc, so the binary also runs on older distros
          - os: ubuntu-22.04
            mode: --onefile
            package: DeepLoyerFree-linux-x86_64.tar.gz
          - os: windows-latest
            mode: --onefile
            package: DeepLoyerFree-windows-x86_64.exe
          # macOS apps must be folders (.app bundles), so no --onefile here
          - os: macos-latest
            mode: --onedir
            package: DeepLoyerFree-macos-arm64.zip
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Build with PyInstaller
        shell: bash
        # Pillow lets PyInstaller convert the .ico icon for macOS
        run: >
          uv run --python 3.12 --with pyside6 --with pyinstaller --with pillow
          pyinstaller ${{ matrix.mode }} --windowed --noconfirm
          --name DeepLoyerFree --icon deeployerfree.ico deeployerfree.py

      - name: Package (Linux)
        if: runner.os == 'Linux'
        # A tarball keeps the execute permission, so users don't need chmod
        run: tar -czf "${{ matrix.package }}" -C dist DeepLoyerFree

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: mv dist/DeepLoyerFree.exe "${{ matrix.package }}"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/DeepLoyerFree.app "${{ matrix.package }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: ${{ matrix.package }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.package }}